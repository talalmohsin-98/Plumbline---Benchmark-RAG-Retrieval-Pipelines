[project]
name = "plumbline"
version = "0.1.0"
description = "Upload your documents. Race six retrieval pipelines. Get real numbers."
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "training"]
extend-exclude = ["frontend", "data", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations — type hints on every signature
    "RUF",
]
ignore = [
    "ANN401",  # allow typing.Any where it is genuinely the right type
    "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["ANN"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "training"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
